# Mirrors site/ to the gh-pages branch on every push to main.
# (Branch-based Pages: the gh-pages branch is what GitHub Pages serves.
# The previous artifact-based flow needed a Pages-enablement API call the
# workflow token is not allowed to make.)
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site/ to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "Pages deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
