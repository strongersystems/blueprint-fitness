# Builds the Astro + React app in app/ and publishes the static output to the
# gh-pages branch (branch-based Pages: the workflow token can't enable the
# artifact-based flow). Asset paths under /blueprint-fitness/img and /video
# are preserved, so the import-pack in import-pack/ keeps working unchanged.
name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Publish dist/ to gh-pages
        run: |
          cd app/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "Deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
